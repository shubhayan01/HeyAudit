# Render Blueprint — https://render.com/docs/blueprint-spec
# Plug-and-play: connect this repo in the Render dashboard ("New +" ->
# "Blueprint") and deploy. No environment variables to set up — the audit runs
# entirely on free, first-party data, and the optional Groq API key for the
# AI-written strategy is pasted into the web form at run time (stored only in
# the operator's browser), not configured on the server.
services:
  - type: web
    name: heyaudit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # Playwright + Chromium + a whole-site crawl need
                              # real RAM; the free/starter tiers (512 MB) tend to
                              # OOM. Drop to a smaller plan only for light use.
    healthCheckPath: /
    autoDeploy: true
